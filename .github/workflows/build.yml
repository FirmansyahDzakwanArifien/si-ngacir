name: Build & Release

# Kapan workflow jalan:
# - PR ke dev/main      : cek project bisa di-import dan di-export (build disimpan sebagai artifact)
# - push ke main        : build Web + Windows (artifact), opsional deploy GitHub Pages
# - push tag v*         : build + GitHub Release berisi zip Web, zip Windows, dan manual
# - manual (Actions tab): tombol "Run workflow"
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    name: Export Web & Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot & export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-windows

      - name: Download Godot & export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz "templates/version.txt" "templates/web_nothreads_*.zip" \
            "templates/windows_*_x86_64.exe" -d "$dest"
          rm godot.zip templates.tpz

      # Template Web ramping (tanpa 3D dan modul yang tidak dipakai), lihat .github/godot/web_template.py.
      # Dibangun sekali lalu disimpan di cache; bila gagal, export memakai template resmi.
      - name: Cache slim web template
        id: cache-webtpl
        uses: actions/cache@v4
        with:
          path: ~/webtpl
          key: webtpl-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/godot/web_template.py') }}

      - name: Setup Emscripten
        if: steps.cache-webtpl.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build slim web template
        if: steps.cache-webtpl.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip install --quiet scons==4.8.1
          git clone --quiet --depth 1 -b "${GODOT_VERSION}-stable" https://github.com/godotengine/godot.git ~/godot-src
          cd ~/godot-src
          scons platform=web target=template_release profile="$GITHUB_WORKSPACE/.github/godot/web_template.py" -j"$(nproc)"
          mkdir -p ~/webtpl
          cp bin/godot.web.template_release.wasm32*.zip ~/webtpl/web_nothreads_release.zip

      - name: Import project
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$godot" --headless --import --path . 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Ada error script saat import project"
            exit 1
          fi

      - name: Export
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p builds/web builds/windows
          if [ -f ~/webtpl/web_nothreads_release.zip ]; then
            # Preset Web (preset pertama) memakai template ramping.
            python3 - "$HOME/webtpl/web_nothreads_release.zip" <<'PY'
          import sys
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = s.replace('custom_template/release=""', f'custom_template/release="{sys.argv[1]}"', 1)
          p.write_text(s)
          PY
            echo "### Template Web: ramping" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Template Web: resmi (template ramping belum tersedia)" >> "$GITHUB_STEP_SUMMARY"
          fi
          "$godot" --headless --path . --export-release "Web" builds/web/index.html
          "$godot" --headless --path . --export-release "Windows Desktop" builds/windows/SiNgacir.exe
          test -f builds/web/index.wasm
          test -f builds/windows/SiNgacir.exe
          {
            echo '| File | Ukuran | gzip |'
            echo '| --- | --- | --- |'
            for f in builds/web/index.wasm builds/web/index.pck builds/web/index.js; do
              echo "| $(basename "$f") | $(du -k "$f" | cut -f1) KB | $(gzip -6 -c "$f" | wc -c | awk '{print int($1/1024)}') KB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          cp docs/MANUAL.md builds/web/MANUAL.md
          cp docs/MANUAL.md builds/windows/MANUAL.md
          (cd builds/web && zip -qr ../../SiNgacir-web.zip .)
          (cd builds/windows && zip -qr ../../SiNgacir-windows.zip .)
          cp docs/MANUAL.md SiNgacir-MANUAL.md
          ls -la SiNgacir-*

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: si-ngacir-builds
          path: SiNgacir-*
          retention-days: 14

      - name: Upload web build for GitHub Pages
        if: vars.DEPLOY_PAGES == 'true' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  android:
    name: Export Android
    runs-on: ubuntu-latest
    env:
      # Keystore permanen (opsional, lihat README bagian Android). Tanpa ini CI memakai keystore sementara.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot & Android templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot & Android templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz "templates/version.txt" "templates/android_*.apk" -d "$dest"
          rm godot.zip templates.tpz

      - name: Keystore
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
            alias="${ANDROID_KEY_ALIAS:-singacir}"
            pass="$ANDROID_KEYSTORE_PASSWORD"
            echo "### Android: ditandatangani keystore permanen" >> "$GITHUB_STEP_SUMMARY"
          else
            alias="singacir"
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "$ks" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Si Ngacir, O=Varmintz KW Studio, C=ID" >/dev/null
            echo "### Android: keystore sementara (update APK perlu uninstall dulu; isi secret ANDROID_KEYSTORE_* untuk keystore permanen)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::add-mask::$pass"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$alias"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$alias"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Editor settings (Android SDK & Java)
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION}.tres"; do
            cat > ~/.config/godot/"$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: Import & export APK
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$godot" --headless --import --path . > import.log 2>&1 || true
          # Versi APK: nama dari tag (atau versi project), kode naik tiap run supaya bisa update.
          name="$(grep -oP 'config/version="\K[^"]+' project.godot)"
          case "$GITHUB_REF" in refs/tags/v*) name="${GITHUB_REF_NAME#v}";; esac
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"$name\"/" export_presets.cfg
          mkdir -p builds/android
          "$godot" --headless --path . --export-release "Android" builds/android/SiNgacir.apk 2>&1 | tee export.log
          test -f builds/android/SiNgacir.apk
          cp builds/android/SiNgacir.apk SiNgacir-android.apk
          echo "APK: $(du -k SiNgacir-android.apk | cut -f1) KB, versi $name ($GITHUB_RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: si-ngacir-android
          path: SiNgacir-android.apk
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: si-ngacir-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Si Ngacir ${{ github.ref_name }}
          files: |
            SiNgacir-web.zip
            SiNgacir-windows.zip
            SiNgacir-android.apk
            SiNgacir-MANUAL.md
          generate_release_notes: true
          body: |
            ## Download

            | Versi | File | Cara main |
            | --- | --- | --- |
            | **Desktop (Windows)** | `SiNgacir-windows.zip` | Ekstrak, jalankan `SiNgacir.exe` |
            | **Web (browser / HP)** | `SiNgacir-web.zip` | Upload ke itch.io (HTML) atau web server, buka `index.html` |
            | **Android** | `SiNgacir-android.apk` | Buka file APK di HP, izinkan "instal dari sumber tidak dikenal" |
            | **Manual** | `SiNgacir-MANUAL.md` | Storyline, kontrol, cara main |

            Windows SmartScreen: pilih **More info → Run anyway**.

  pages:
    name: Deploy GitHub Pages
    if: vars.DEPLOY_PAGES == 'true' && github.event_name == 'push'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  itch:
    name: Deploy itch.io
    # Aktif bila repo variable ITCH_GAME (contoh: namauser/si-ngacir) dan secret BUTLER_API_KEY diisi.
    if: startsWith(github.ref, 'refs/tags/v') && vars.ITCH_GAME != ''
    needs: [export, android]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: si-ngacir-*
          merge-multiple: true

      - name: Push to itch.io
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          version="${GITHUB_REF_NAME#v}"
          ./butler/butler push SiNgacir-web.zip "${{ vars.ITCH_GAME }}:html5" --userversion "$version"
          ./butler/butler push SiNgacir-windows.zip "${{ vars.ITCH_GAME }}:windows" --userversion "$version"
          ./butler/butler push SiNgacir-android.apk "${{ vars.ITCH_GAME }}:android" --userversion "$version"
